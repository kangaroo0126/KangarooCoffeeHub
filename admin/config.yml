# ============================================================
# Decap CMS 設定檔
# ============================================================

backend:
  name: github
  repo: kangaroo0126/KangarooCoffeeHub
  branch: main
  base_url: https://kangaroocoffeehub-decap-proxy.kangaroocoffeehub.workers.dev

# site_url：不影響即時預覽面板，但補上後可以讓 Decap 之後串「在網站上查看」
# 這類功能時有明確依據，先加上無壞處。
site_url: https://kangaroo0126.github.io/KangarooCoffeeHub

media_folder: "static/img/uploads"
public_folder: "/img/uploads"

locale: "zh_Hant"

collections:

  - name: "blog"
    label: "✍️ 日常思考"
    folder: "blog"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "標題", name: "title", widget: "string" }
      - { label: "發布日期", name: "date", widget: "datetime" }
      - { label: "作者", name: "authors", widget: "string", required: false }
      - label: "封面圖／精選圖片"
        name: "image"
        widget: "image"
        required: false
        hint: "建議尺寸約 1200x630。這張圖會用在文章列表縮圖與社群分享卡（og:image）。"
      - label: "標籤"
        name: "tags"
        widget: "relation"
        collection: "tags"
        search_fields: ["name"]
        display_fields: ["name"]
        value_field: "name"
        multiple: true
        required: false
        hint: "請從既有標籤庫挑選；找不到想要的標籤時，先到左側選單「🏷️ 標籤庫」新增一筆，再回來選取，避免同一個標籤打成不同字（例如「心理學」與「心理」）。"
      - { label: "文章摘要", name: "description", widget: "text", required: false }
      - label: "內文"
        name: "body"
        widget: "markdown"
        modes: ["raw", "rich_text"]
        hint: "若要插入表格，請切換到「原始碼」模式，直接貼上或輸入 Markdown 表格語法（| 欄位 | 欄位 |）。"

  - name: "tags"
    label: "🏷️ 標籤庫"
    folder: "data/tags"
    create: true
    format: "yaml"
    extension: "yml"
    slug: "{{slug}}"
    summary: "{{name}}"
    fields:
      - { label: "標籤名稱", name: "name", widget: "string" }

  - name: "docs_education"
    label: "專題文章-教育與學習"
    folder: "docs/教育與學習"
    create: true
    nested:
      depth: 100
      summary: "{{title}}"
    slug: "{{slug}}"
    fields: &docs_fields
      - { label: "標題", name: "title", widget: "string" }
      - { label: "側邊欄排序", name: "sidebar_position", widget: "number", required: false }
      - { label: "簡短描述", name: "description", widget: "string", required: false }
      - label: "封面圖／精選圖片"
        name: "image"
        widget: "image"
        required: false
        hint: "建議尺寸約 1200x630，用於列表頁縮圖與社群分享卡（og:image）。若要在頁面上實際顯示，網站樣板須支援讀取此欄位，請告訴我，我可以協助調整。"
      - label: "內文"
        name: "body"
        widget: "markdown"
        modes: ["raw", "rich_text"]
        hint: "若要插入表格，請切換到「原始碼」模式，直接貼上或輸入 Markdown 表格語法（| 欄位 | 欄位 |）。"

  - name: "docs_society"
    label: "專題文章-社會"
    folder: "docs/社會"
    create: true
    nested:
      depth: 100
      summary: "{{title}}"
    slug: "{{slug}}"
    fields: *docs_fields

  - name: "docs_social_work"
    label: "專題文章-社會工作"
    folder: "docs/社會工作"
    create: true
    nested:
      depth: 100
      summary: "{{title}}"
    slug: "{{slug}}"
    fields: *docs_fields

  - name: "docs_social_innovation"
    label: "專題文章-社會創新"
    folder: "docs/社會創新"
    create: true
    nested:
      depth: 100
      summary: "{{title}}"
    slug: "{{slug}}"
    fields: *docs_fields

  - name: "docs_psychology"
    label: "專題文章-心理學"
    folder: "docs/心理學"
    create: true
    nested:
      depth: 100
      summary: "{{title}}"
    slug: "{{slug}}"
    fields: *docs_fields

  - name: "docs_tech"
    label: "專題文章-資訊與科技"
    folder: "docs/資訊與科技"
    create: true
    nested:
      depth: 100
      summary: "{{title}}"
    slug: "{{slug}}"
    fields: *docs_fields

  - name: "docs_others"
    label: "專題文章-其他"
    folder: "docs/其他"
    create: true
    nested:
      depth: 100
      summary: "{{title}}"
    slug: "{{slug}}"
    fields: *docs_fields

  - name: "slowlife_cafe"
    label: "慢行生活-咖啡廳"
    folder: "slowlife/咖啡廳"
    create: true
    nested:
      depth: 100
      summary: "{{title}}"
    slug: "{{slug}}"
    fields: *docs_fields

  - name: "slowlife_band"
    label: "慢行生活-樂團"
    folder: "slowlife/樂團"
    create: true
    nested:
      depth: 100
      summary: "{{title}}"
    slug: "{{slug}}"
    fields: *docs_fields

  - name: "pages"
    label: "📄 單頁內容"
    files:
      - label: "關於我"
        name: "about"
        file: "src/pages/about.md"
        fields:
          - { label: "標題", name: "title", widget: "string", required: false }
          - label: "內文"
            name: "body"
            widget: "markdown"
            modes: ["raw", "rich_text"]
            hint: "若要插入表格，請切換到「原始碼」模式，直接貼上或輸入 Markdown 表格語法（| 欄位 | 欄位 |）。"
      - label: "我的書櫃"
        name: "myshelf"
        file: "src/pages/myshelf.md"
        fields:
          - label: "內文"
            name: "body"
            widget: "markdown"
            modes: ["raw", "rich_text"]
            hint: "若要插入表格，請切換到「原始碼」模式，直接貼上或輸入 Markdown 表格語法（| 欄位 | 欄位 |）。"
      - label: "教育倡議"
        name: "education_advocacy"
        file: "src/pages/EducationAdvocacy.md"
        fields:
          - { label: "標題", name: "title", widget: "string", required: false }
          - label: "內文"
            name: "body"
            widget: "markdown"
            modes: ["raw", "rich_text"]
            hint: "若要插入表格，請切換到「原始碼」模式，直接貼上或輸入 Markdown 表格語法（| 欄位 | 欄位 |）。"