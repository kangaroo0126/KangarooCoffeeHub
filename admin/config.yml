    nested:
      depth: 100
      summary: "{{title}}"
    slug: "{{slug}}"
    fields: *docs_fields

  - name: "docs_tech"
    label: "專題文章-資訊與科技"
    folder: "docs/資訊與科技"
    create: true
    nested:
      depth: 100
