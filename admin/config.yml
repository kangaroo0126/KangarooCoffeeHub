      depth: 100
      summary: "{{title}}"
    slug: "{{slug}}"
    fields: *docs_fields

  - name: "slowlife_cafe"
    label: "慢行生活-咖啡廳"
    folder: "slowlife/咖啡廳"
    create: true
    nested:
      depth: 100
      summary: "{{title}}"
    slug: "{{slug}}"
    fields: *docs_fields

  - name: "slowlife_band"
    label: "慢行生活-樂團"
    folder: "slowlife/樂團"
    create: true
    nested:
      depth: 100
      summary: "{{title}}"
    slug: "{{slug}}"
    fields: *docs_fields

  - name: "pages"
    label: "📄 單頁內容"
    files:
      - label: "關於我"
        name: "about"
        file: "src/pages/about.md"
        fields:
          - { label: "標題", name: "title", widget: "string", required: false }
          - label: "內文"
            name: "body"
            widget: "markdown"
            modes: ["raw", "rich_text"]
            hint: "若要插入表格，請切換到「原始碼」模式，直接貼上或輸入 Markdown 表格語法（| 欄位 | 欄位 |）。"
      - label: "我的書櫃"
        name: "myshelf"
        file: "src/pages/myshelf.md"
        fields:
          - label: "內文"
            name: "body"
            widget: "markdown"
            modes: ["raw", "rich_text"]
            hint: "若要插入表格，請切換到「原始碼」模式，直接貼上或輸入 Markdown 表格語法（| 欄位 | 欄位 |）。"
      - label: "教育倡議"
        name: "education_advocacy"
        file: "src/pages/EducationAdvocacy.md"
        fields:
          - { label: "標題", name: "title", widget: "string", required: false }
          - label: "內文"
